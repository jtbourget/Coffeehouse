$kind: http-request
description: Updates the candidate profile using {{id}} collection variable.
url: "{{baseUrl}}/api/candidateprofiles/{{id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Jane Doe Candidate",
        "ocdId": "ocd-division/country:us/state:wi/cd:2",
        "bio": "Updated civic leader biography with expanded campaign priorities.",
        "websiteUrl": "https://janedoe4congress.org/platform"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 8000
