$kind: http-request
description: Tests PUT with a non-existent ID, expecting 404 Not Found.
url: "{{baseUrl}}/api/candidateprofiles/999999"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
        "name": "Non-existent Profile",
        "ocdId": "ocd-division/country:us/state:wi",
        "bio": "Updating non-existent profile.",
        "websiteUrl": "https://example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Returns ProblemDetails for missing resource", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql(404);
      });
    language: text/javascript
order: 9000
