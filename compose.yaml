services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-22.04
    container_name: coffeehouse-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Required. Set in a .env file or process environment.}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - coffeehouse-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  coffeehouse-sql-data:
